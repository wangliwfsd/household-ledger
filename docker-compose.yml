services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - ledger-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://ledger:${POSTGRES_PASSWORD:-change-this-password}@db:5432/ledger
      APP_USERNAME: ${APP_USERNAME:-family}
      APP_PASSWORD: ${APP_PASSWORD:-change-this-login-password}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  ledger-data:
